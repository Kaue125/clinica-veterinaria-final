<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VetCare – Painel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2ecc71; --primary-dark: #27ae60;
      --secondary: #1a1a2e; --accent: #f39c12;
      --danger: #e74c3c; --info: #3498db;
      --text: #333; --text-light: #666;
      --bg: #f0f4f8; --white: #fff;
      --shadow: 0 4px 20px rgba(0,0,0,.08);
      --radius: 14px; --tr: .25s ease;
    }
    body { font-family:'Poppins',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    a { text-decoration:none; color:inherit; }

    /* ── LOGIN ── */
    .login-screen {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh;
      background: linear-gradient(135deg, var(--secondary) 0%, #16213e 100%);
    }
    .login-card {
      background:var(--white); border-radius:var(--radius);
      padding:48px 40px; width:100%; max-width:400px;
      box-shadow:0 24px 64px rgba(0,0,0,.3); text-align:center;
    }
    .login-card .logo { font-size:1.8rem; font-weight:700; color:var(--secondary); margin-bottom:8px; }
    .login-card .logo i { color:var(--primary); margin-right:8px; }
    .login-card p { color:var(--text-light); margin-bottom:32px; font-size:.9rem; }
    .login-card input {
      width:100%; padding:14px 16px; border:2px solid #e8e8e8;
      border-radius:10px; font-family:inherit; font-size:.95rem;
      outline:none; transition:var(--tr); margin-bottom:16px;
    }
    .login-card input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(46,204,113,.15); }
    .login-card button {
      width:100%; padding:14px; background:var(--primary); color:var(--white);
      border:none; border-radius:10px; font-family:inherit;
      font-size:1rem; font-weight:600; cursor:pointer; transition:var(--tr);
    }
    .login-card button:hover { background:var(--primary-dark); }
    .login-error { color:var(--danger); font-size:.85rem; margin-top:12px; display:none; }

    /* ── LAYOUT ── */
    .app { display:none; min-height:100vh; }
    .sidebar {
      position:fixed; top:0; left:0; bottom:0; width:260px;
      background:var(--secondary); padding:0;
      display:flex; flex-direction:column; z-index:100;
    }
    .sidebar-brand {
      padding:28px 24px 24px;
      border-bottom:1px solid rgba(255,255,255,.08);
      display:flex; align-items:center; gap:10px;
    }
    .sidebar-brand .logo-text { font-size:1.2rem; font-weight:700; color:var(--white); }
    .sidebar-brand i { color:var(--primary); font-size:1.4rem; }
    .sidebar-brand small { display:block; color:rgba(255,255,255,.4); font-size:.72rem; font-weight:400; }

    .sidebar-nav { padding:16px 0; flex:1; overflow-y:auto; }
    .nav-section-label {
      padding:8px 24px 4px;
      font-size:.68rem; font-weight:700; letter-spacing:1.5px;
      text-transform:uppercase; color:rgba(255,255,255,.3);
    }
    .sidebar-link {
      display:flex; align-items:center; gap:12px;
      padding:12px 24px; color:rgba(255,255,255,.6);
      font-size:.88rem; font-weight:500; cursor:pointer;
      transition:var(--tr); border-left:3px solid transparent;
    }
    .sidebar-link:hover { background:rgba(255,255,255,.06); color:var(--white); }
    .sidebar-link.active {
      background:rgba(46,204,113,.12); color:var(--primary);
      border-left-color:var(--primary);
    }
    .sidebar-link i { width:18px; text-align:center; }

    .sidebar-footer {
      padding:20px 24px;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .sidebar-footer a {
      display:flex; align-items:center; gap:10px;
      color:rgba(255,255,255,.4); font-size:.82rem;
      transition:var(--tr);
    }
    .sidebar-footer a:hover { color:var(--white); }

    .main-content { margin-left:260px; padding:32px; min-height:100vh; }

    .topbar {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:32px;
    }
    .topbar h1 { font-size:1.6rem; font-weight:700; color:var(--secondary); }
    .topbar-actions { display:flex; align-items:center; gap:12px; }
    .btn-refresh {
      padding:10px 20px; border-radius:50px; border:2px solid var(--primary);
      background:transparent; color:var(--primary); font-family:inherit;
      font-size:.85rem; font-weight:600; cursor:pointer; transition:var(--tr);
      display:flex; align-items:center; gap:8px;
    }
    .btn-refresh:hover { background:var(--primary); color:var(--white); }
    .btn-logout {
      padding:10px 20px; border-radius:50px; border:2px solid #e8e8e8;
      background:transparent; color:var(--text-light); font-family:inherit;
      font-size:.85rem; font-weight:600; cursor:pointer; transition:var(--tr);
      display:flex; align-items:center; gap:8px;
    }
    .btn-logout:hover { border-color:var(--danger); color:var(--danger); }

    /* ── KPI CARDS ── */
    .kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:32px; }
    .kpi-card {
      background:var(--white); border-radius:var(--radius);
      padding:24px; box-shadow:var(--shadow);
      display:flex; align-items:center; gap:16px;
    }
    .kpi-icon {
      width:52px; height:52px; border-radius:14px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.3rem; flex-shrink:0;
    }
    .kpi-icon.green { background:rgba(46,204,113,.12); color:var(--primary); }
    .kpi-icon.orange { background:rgba(243,156,18,.12); color:var(--accent); }
    .kpi-icon.blue { background:rgba(52,152,219,.12); color:var(--info); }
    .kpi-icon.red { background:rgba(231,76,60,.12); color:var(--danger); }
    .kpi-info h3 { font-size:1.8rem; font-weight:700; color:var(--secondary); line-height:1; }
    .kpi-info p { font-size:.8rem; color:var(--text-light); margin-top:4px; }

    /* ── FILTERS ── */
    .filters-bar {
      display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap;
    }
    .filter-select, .search-input {
      padding:10px 14px; border:2px solid #e8e8e8; border-radius:10px;
      font-family:inherit; font-size:.88rem; color:var(--text);
      outline:none; transition:var(--tr); background:var(--white);
    }
    .filter-select:focus, .search-input:focus { border-color:var(--primary); }
    .search-input { flex:1; min-width:200px; }

    /* ── TABLE ── */
    .table-card { background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; }
    .table-header {
      padding:20px 24px; border-bottom:1px solid #f0f0f0;
      display:flex; align-items:center; justify-content:space-between;
    }
    .table-header h2 { font-size:1.05rem; font-weight:600; color:var(--secondary); }
    .table-count { font-size:.82rem; color:var(--text-light); }
    table { width:100%; border-collapse:collapse; }
    thead th {
      padding:12px 16px; background:#fafafa;
      font-size:.78rem; font-weight:700; color:var(--text-light);
      text-align:left; text-transform:uppercase; letter-spacing:.8px;
      border-bottom:2px solid #f0f0f0;
    }
    tbody tr { transition:var(--tr); }
    tbody tr:hover { background:#fafffe; }
    tbody td { padding:14px 16px; border-bottom:1px solid #f8f8f8; font-size:.88rem; vertical-align:middle; }
    tbody tr:last-child td { border-bottom:none; }

    .badge {
      display:inline-flex; align-items:center; gap:5px;
      padding:4px 12px; border-radius:50px;
      font-size:.72rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    }
    .badge-pendente  { background:rgba(243,156,18,.12); color:#c77f0a; }
    .badge-confirmado{ background:rgba(46,204,113,.12); color:var(--primary-dark); }
    .badge-concluido { background:rgba(52,152,219,.12); color:var(--info); }
    .badge-cancelado { background:rgba(231,76,60,.10); color:var(--danger); }

    .action-btns { display:flex; gap:6px; }
    .action-btn {
      width:32px; height:32px; border-radius:8px; border:none;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:.85rem; transition:var(--tr); font-family:inherit;
    }
    .action-btn.confirm { background:rgba(46,204,113,.12); color:var(--primary-dark); }
    .action-btn.confirm:hover { background:var(--primary); color:var(--white); }
    .action-btn.cancel  { background:rgba(231,76,60,.1); color:var(--danger); }
    .action-btn.cancel:hover  { background:var(--danger); color:var(--white); }
    .action-btn.wa     { background:rgba(37,211,102,.12); color:#16a34a; }
    .action-btn.wa:hover     { background:#25d366; color:var(--white); }
    .action-btn.done   { background:rgba(52,152,219,.1); color:var(--info); }
    .action-btn.done:hover   { background:var(--info); color:var(--white); }

    .empty-state {
      text-align:center; padding:64px 24px;
      color:var(--text-light);
    }
    .empty-state i { font-size:3rem; margin-bottom:16px; opacity:.3; display:block; }
    .empty-state p { font-size:.95rem; }

    .loading-state { text-align:center; padding:48px; color:var(--text-light); }
    .loading-state i { font-size:2rem; color:var(--primary); }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:24px; right:24px; z-index:9999;
      background:var(--secondary); color:var(--white);
      padding:14px 20px; border-radius:12px;
      display:flex; align-items:center; gap:10px;
      font-size:.9rem; font-weight:500;
      box-shadow:0 8px 32px rgba(0,0,0,.25);
      transform:translateY(80px); opacity:0;
      transition:all .35s cubic-bezier(.34,1.56,.64,1);
      max-width:360px;
    }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast-sucesso i { color:var(--primary); }
    .toast-erro i { color:var(--danger); }

    /* ── RESPONSIVE ── */
    @media(max-width:1024px) {
      .kpi-grid { grid-template-columns:repeat(2,1fr); }
    }
    @media(max-width:768px) {
      .sidebar { transform:translateX(-100%); transition:var(--tr); }
      .sidebar.open { transform:translateX(0); }
      .main-content { margin-left:0; padding:20px; }
      .kpi-grid { grid-template-columns:1fr 1fr; }
      table { display:block; overflow-x:auto; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ── -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <div class="logo"><i class="fas fa-paw"></i> VetCare</div>
    <p>Painel de Administração</p>
    <input type="password" id="login-password" placeholder="Senha de acesso" autocomplete="current-password"/>
    <button onclick="handleLogin()"><i class="fas fa-sign-in-alt"></i> Entrar</button>
    <p class="login-error" id="login-error">Senha incorreta. Tente novamente.</p>
  </div>
</div>

<!-- ── APP ── -->
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-paw"></i>
      <div>
        <div class="logo-text">VetCare</div>
        <small>Painel Admin</small>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <div class="sidebar-link active" onclick="showPage('agendamentos')" id="nav-agendamentos">
        <i class="fas fa-calendar-alt"></i> Agendamentos
        <span class="nav-badge" id="nav-badge" style="display:none;margin-left:auto;background:var(--accent);color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:50px;">0</span>
      </div>
      <div class="sidebar-link" onclick="window.open('index.html','_blank')">
        <i class="fas fa-external-link-alt"></i> Ver Site
      </div>
    </nav>
    <div class="sidebar-footer">
      <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sair</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="main-content">
    <div class="topbar">
      <h1 id="page-title"><i class="fas fa-calendar-alt"></i> Agendamentos</h1>
      <div class="topbar-actions">
        <button class="btn-refresh" onclick="loadAgendamentos()">
          <i class="fas fa-sync-alt"></i> Atualizar
        </button>
        <button class="btn-logout" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Sair
        </button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon orange"><i class="fas fa-clock"></i></div>
        <div class="kpi-info"><h3 id="kpi-pendente">0</h3><p>Pendentes</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon green"><i class="fas fa-check-circle"></i></div>
        <div class="kpi-info"><h3 id="kpi-confirmado">0</h3><p>Confirmados</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon blue"><i class="fas fa-flag-checkered"></i></div>
        <div class="kpi-info"><h3 id="kpi-concluido">0</h3><p>Concluídos</p></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon red"><i class="fas fa-times-circle"></i></div>
        <div class="kpi-info"><h3 id="kpi-cancelado">0</h3><p>Cancelados</p></div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="filters-bar">
      <input class="search-input" id="search-input" type="text" placeholder="🔍  Buscar por nome, pet ou serviço..." oninput="renderTable()"/>
      <select class="filter-select" id="status-filter" onchange="renderTable()">
        <option value="">Todos os status</option>
        <option value="pendente">Pendentes</option>
        <option value="confirmado">Confirmados</option>
        <option value="concluido">Concluídos</option>
        <option value="cancelado">Cancelados</option>
      </select>
    </div>

    <!-- Tabela -->
    <div class="table-card">
      <div class="table-header">
        <h2>Lista de Agendamentos</h2>
        <span class="table-count" id="table-count">–</span>
      </div>
      <div id="table-body-wrapper">
        <div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p style="margin-top:12px">Carregando...</p></div>
      </div>
    </div>
  </main>
</div>

<script src="firebase-config.js"></script>
<script>
// ── SENHA PADRÃO (fallback caso firebase-config.js não carregue) ──
const ADMIN_SENHA = (typeof VetCareConfig !== 'undefined')
  ? VetCareConfig.admin.senha
  : 'vetcare2024';

const WHATSAPP_NUM = (typeof VetCareConfig !== 'undefined')
  ? VetCareConfig.whatsapp.numero
  : '5511987654321';

// ── AUTH ──────────────────────────────────────
function handleLogin() {
  const pw = document.getElementById('login-password').value.trim();
  // Aceita a senha do config OU a padrão
  const senhaCorreta = (typeof VetCareConfig !== 'undefined')
    ? VetCareConfig.admin.senha
    : 'vetcare2024';

  if (pw === senhaCorreta) {
    sessionStorage.setItem('admin_auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    startApp();
  } else {
    const errEl = document.getElementById('login-error');
    errEl.style.display='block';
    errEl.textContent = `Senha incorreta. (dica: verifique firebase-config.js)`;
    document.getElementById('login-password').value = '';
    document.getElementById('login-password').focus();
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key==='Enter') handleLogin();
  });
  // Auto-login se já estava autenticado
  if (sessionStorage.getItem('admin_auth')==='1') {
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    startApp();
  }
});

function logout() {
  sessionStorage.removeItem('admin_auth');
  location.reload();
}

// ── APP ──────────────────────────────────────
const STORAGE_KEY_ADMIN = 'vetcare_agendamentos';
let allAgendamentos = [];
let knownIds = new Set();

// DB local inline — não depende do firebase-config.js
const AdminDB = {
  lerLocal() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY_ADMIN) || '[]'); }
    catch { return []; }
  },
  gravarLocal(lista) {
    localStorage.setItem(STORAGE_KEY_ADMIN, JSON.stringify(lista));
  },
  async buscar() {
    // Tenta Firebase primeiro, senão usa local
    if (typeof VetCareDB !== 'undefined' && VetCareDB.db) {
      try { return await VetCareDB.buscarAgendamentos(); } catch {}
    }
    return this.lerLocal();
  },
  async atualizarStatus(id, status) {
    if (typeof VetCareDB !== 'undefined' && VetCareDB.db) {
      try { await VetCareDB.atualizarStatus(id, status); return; } catch {}
    }
    const lista = this.lerLocal();
    const idx = lista.findIndex(a => a.id === id);
    if (idx >= 0) { lista[idx].status = status; this.gravarLocal(lista); }
  }
};

async function startApp() {
  // Inicia Firebase se configurado
  if (typeof VetCareDB !== 'undefined') {
    await VetCareDB.init().catch(() => {});
  }
  await loadAgendamentos();

  // Escuta mudanças em tempo real (entre abas)
  window.addEventListener('storage', async (e) => {
    if (e.key === STORAGE_KEY_ADMIN || e.key === null) {
      const anterior = allAgendamentos.length;
      allAgendamentos = await AdminDB.buscar();
      const novos = allAgendamentos.filter(a => !knownIds.has(a.id));
      novos.forEach(a => knownIds.add(a.id));
      if (novos.length > 0) {
        showToast(`🔔 ${novos.length} novo(s) agendamento(s)!`, 'sucesso');
        let blink = 0;
        const orig = document.title;
        const iv = setInterval(() => {
          document.title = blink++ % 2 === 0 ? '🔔 Novo agendamento!' : orig;
          if (blink > 8) { clearInterval(iv); document.title = orig; }
        }, 600);
      }
      updateKPIs(); renderTable();
    }
  });

  // Atualiza a cada 30s
  setInterval(async () => {
    allAgendamentos = await AdminDB.buscar();
    updateKPIs(); renderTable();
  }, 30000);
}

async function loadAgendamentos() {
  document.getElementById('table-body-wrapper').innerHTML =
    '<div class="loading-state"><i class="fas fa-spinner fa-spin"></i><p style="margin-top:12px">Carregando...</p></div>';
  allAgendamentos = await AdminDB.buscar();
  knownIds = new Set(allAgendamentos.map(a => a.id));
  updateKPIs();
  renderTable();
}

function updateKPIs() {
  const count = s => allAgendamentos.filter(a=>a.status===s).length;
  document.getElementById('kpi-pendente').textContent   = count('pendente');
  document.getElementById('kpi-confirmado').textContent = count('confirmado');
  document.getElementById('kpi-concluido').textContent  = count('concluido');
  document.getElementById('kpi-cancelado').textContent  = count('cancelado');
  // Atualiza badge de pendentes no sidebar
  const badge = document.getElementById('nav-badge');
  const pendentes = count('pendente');
  if (badge) {
    badge.textContent = pendentes;
    badge.style.display = pendentes > 0 ? '' : 'none';
  }
}

function renderTable() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const status = document.getElementById('status-filter').value;

  let list = allAgendamentos.filter(a => {
    const matchSearch = !search ||
      a.nome?.toLowerCase().includes(search) ||
      a.pet?.toLowerCase().includes(search) ||
      a.servico?.toLowerCase().includes(search) ||
      a.telefone?.includes(search);
    const matchStatus = !status || a.status===status;
    return matchSearch && matchStatus;
  });

  document.getElementById('table-count').textContent = `${list.length} resultado${list.length!==1?'s':''}`;

  if (!list.length) {
    document.getElementById('table-body-wrapper').innerHTML =
      '<div class="empty-state"><i class="fas fa-calendar-times"></i><p>Nenhum agendamento encontrado.</p></div>';
    return;
  }

  const badgeMap = {
    pendente:  '<span class="badge badge-pendente"><i class="fas fa-clock"></i> Pendente</span>',
    confirmado:'<span class="badge badge-confirmado"><i class="fas fa-check"></i> Confirmado</span>',
    concluido: '<span class="badge badge-concluido"><i class="fas fa-flag-checkered"></i> Concluído</span>',
    cancelado: '<span class="badge badge-cancelado"><i class="fas fa-times"></i> Cancelado</span>'
  };

  const rows = list.map(a => {
    const num = (typeof VetCareConfig !== 'undefined') ? VetCareConfig.whatsapp.numero : '5511987654321';
    const waMsg = encodeURIComponent(
      `Olá ${a.nome}! 😊 Confirmando seu agendamento na *VetCare*:\n📅 *${a.dataFormatada}* às *${a.horario}*\n💉 *${a.servico}*\nQualquer dúvida estamos aqui!`
    );
    const waLink = `https://wa.me/${num}?text=${waMsg}`;
    const statusBadge = badgeMap[a.status] || `<span class="badge">${a.status}</span>`;
    const criadoEm = a.criadoEm?.toDate
      ? a.criadoEm.toDate().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})
      : (a.criadoEm ? new Date(a.criadoEm).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—');

    return `<tr>
      <td><strong>${a.nome||'—'}</strong><br><small style="color:#999">${a.telefone||''}</small></td>
      <td>${a.pet||'—'}</td>
      <td>${a.servico||'—'}</td>
      <td><strong>${a.horario||'—'}</strong><br><small style="color:#999">${a.dataFormatada||''}</small></td>
      <td>${statusBadge}</td>
      <td><small style="color:#aaa">${criadoEm}</small></td>
      <td>
        <div class="action-btns">
          ${a.status!=='confirmado'&&a.status!=='concluido'?`<button class="action-btn confirm" title="Confirmar" onclick="updateStatus('${a.id}','confirmado')"><i class="fas fa-check"></i></button>`:''}
          ${a.status!=='concluido'?`<button class="action-btn done" title="Concluir" onclick="updateStatus('${a.id}','concluido')"><i class="fas fa-flag-checkered"></i></button>`:''}
          ${a.status!=='cancelado'?`<button class="action-btn cancel" title="Cancelar" onclick="updateStatus('${a.id}','cancelado')"><i class="fas fa-times"></i></button>`:''}
          <a href="${waLink}" target="_blank" rel="noopener"><button class="action-btn wa" title="WhatsApp"><i class="fab fa-whatsapp"></i></button></a>
        </div>
      </td>
    </tr>`;
  }).join('');

  document.getElementById('table-body-wrapper').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Cliente</th><th>Pet</th><th>Serviço</th>
          <th>Data/Hora</th><th>Status</th><th>Criado em</th><th>Ações</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
}

async function updateStatus(id, status) {
  const labels = {confirmado:'Confirmado',concluido:'Concluído',cancelado:'Cancelado'};
  await AdminDB.atualizarStatus(id, status);
  const idx = allAgendamentos.findIndex(a=>a.id===id);
  if (idx>=0) allAgendamentos[idx].status=status;
  updateKPIs();
  renderTable();
  showToast(`Agendamento ${labels[status].toLowerCase()} com sucesso!`, 'sucesso');
}

function showPage(page) {
  document.querySelectorAll('.sidebar-link').forEach(l=>l.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

// ── TOAST ────────────────────────────────────
function showToast(msg, tipo='sucesso') {
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div');
  t.className=`toast toast-${tipo}`;
  t.innerHTML=`<i class="fas fa-${tipo==='sucesso'?'check-circle':'exclamation-circle'}"></i> ${msg}`;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},4000);
}
</script>
