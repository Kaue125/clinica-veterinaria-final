version: '3.8'

# =======================================================
# Evolution API v2.x com PostgreSQL Integrado
# Roda Localmente com um único comando: docker compose up -d
# =======================================================

services:
  # Banco de dados PostgreSQL (Obrigatório para Evolution API v2.x)
  postgres:
    image: postgres:15-alpine
    container_name: vetcare-postgres
    restart: always
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolutionpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Aplicação Evolution API
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: vetcare-evolution
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      # Configurações do Servidor
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080

      # Chave/Autenticação de acesso à API
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=vetcare-secret-key

      # Conexão com o Banco PostgreSQL
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolutionpassword@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_DATA_MEDIA_MESSAGE=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true

      # Instâncias
      - DEL_INSTANCE=false

      # Log
      - LOG_LEVEL=ERROR,WARN,INFO
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  postgres_data:
  evolution_instances: