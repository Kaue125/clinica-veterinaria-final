services:
  - type: web
    name: vetcare
    runtime: node
    rootDir: Servidor
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: EVOLUTION_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        value: vetcare
      - key: CLINICA_NUM
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
